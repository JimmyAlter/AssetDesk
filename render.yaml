# Render free web services have no persistent disk. The SQLite file lives on
# the instance's ephemeral filesystem and is recreated and seeded with the demo
# data on every deploy or restart (including after the service sleeps).
services:
  - type: web
    name: assetdesk-backend
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Render puts one proxy in front of the service.
      - key: TRUST_PROXY
        value: 1
      - key: CORS_ORIGIN
        value: https://assetdesk-demo.vercel.app
